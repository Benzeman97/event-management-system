    grant-type: password

resilience4j:
 circuitbreaker:
  instances:
   paymentService: ##name you reference in @CircuitBreaker(name = "paymentService")
     registerHealthIndicator: true ## Exposes /actuator/health info
     slidingWindowType: COUNT_BASED ## Uses last N calls (not time-based)
     slidingWindowSize: 10  ## Looks at last 10 calls
     minimumNumberOfCalls: 5 ## minimumNumberOfCalls is the minimum number of requests that must happen before the Circuit Breaker is allowed to make a decision  # Without minimumNumberOfCalls * First call fails → 100% failure rate * Circuit opens immediately * System blocks all traffic too early
     permitted-number-of-calls-in-half-open-state: 3 ## How many test calls are allowed when recovering #3 test calls in HALF_OPEN # 3 requests allowed # If all succeed → CLOSED # If any fails → OPEN again # Prevents flooding a recovering service
     wait-duration-in-open-state: 10s ## Circuit stays OPEN for 10 seconds # For 10 seconds → no calls allowed # After 10s → goes to HALF_OPEN # “Let the payment service breathe for 10 seconds”
     failure-rate-threshold: 50 ## ≥ 50% failures → circuit opens
     slow-call-rate-threshold: 50 ## Only if 50% are slow → count as failure
     slow-call-duration-threshold: 2s ## Calls > 2s are considered slow # Response > 2 seconds = slow # Even if response is 200 OK

 retry:
    instances:
      paymentService:
        max-attempts: 3 ## Number of retry attempts
        wait-duration: 1s ## Pause between retries
        retry-exceptions: ## Exceptions that trigger retry # “Only retry the call if the exception thrown by the method matches one of these types.”  # So, if a call fails and throws any other exception (like PaymentServiceException or IllegalArgumentException), Resilience4j will NOT retry it.
          - java.io.IOException  ## Network errors
          - feign.RetryableException  ## feign.RetryableException

database:
  host1: 'event-managment-db.cb6kiu4gsw4z.us-east-1.rds.amazonaws.com'
  host2: 'event-managment-db.cb6kiu4gsw5z.us-east-1.rds.amazonaws.com'
  host3: 'event-managment-db.cb6kiu4gsw6z.us-east-1.rds.amazonaws.com'
  port: 5432
  db-name: event_management_db

spring:
  datasource:
    master:
      url: jdbc:postgresql://${database.host1}:${database.port}/${database.db-name}?sslmode=require
      username: postgres
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 8
        connection-timeout: 30000
        idle-timeout: 600000
        connection-test-query: SELECT 1

    slave1:
      url: jdbc:postgresql://${database.host2}:${database.port}/${database.db-name}?sslmode=require
      username: postgres
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 15
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        connection-test-query: SELECT 1

    slave2:
      url: jdbc:postgresql://${database.host3}:${database.port}/${database.db-name}?sslmode=require
      username: postgres
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 15
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        connection-test-query: SELECT 1

  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
 redis:
   cluster:
    nodes:
      - 104.36.85.71:6969
      - 104.36.85.72:6969
      - 104.36.85.73:6969
    max-redirects: 5
   timeout: 5000 
   cache:
   cache-names: EVENTS
   redis:
     time-to-live: 300000
 cloud:
  openfeign:
   client:
    config:
     default:
      connectTimeout: 3000
      readTimeout: 5000
      logger-level: debug

